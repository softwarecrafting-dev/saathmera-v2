  <symbol id="a-doctor-visit" viewBox="0 0 64 64"><path d="M10 30L32 12l22 18v22a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4z" style="fill:var(--primary-100)"/><path d="M6 32L32 10l26 22M12 28v24a4 4 0 0 0 4 4h32a4 4 0 0 0 4-4V28" fill="none" style="stroke:var(--primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 30v16M24 38h16" fill="none" style="stroke:var(--primary)" stroke-width="3.2" stroke-linecap="round"/></symbol>
