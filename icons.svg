<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- SaathMera web v2 icon set. Run sync-icons.py after editing: it copies this file into every page.

       Two families:
       ui-*  small interface glyphs drawn in currentColor, used inside buttons and links (24 grid).
