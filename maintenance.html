<title>Back shortly, SaathMera</title>

<style>
/*
 * Maintenance (503). The web server shows this page while the app is down, so it carries
 * everything it needs: no site.css, no script, no image file. The colours are the v2 tokens.
 */
:root{
  --primary-200:#afc8ec;
  --ink-900:#0b1220; --ink-800:#17202e; --r-lg:22px;
  --sans:'Inter','Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box; margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:48px 16px;
  font:400 16px/1.6 var(--sans); color:#fff; background:var(--ink-900);
  background-image:radial-gradient(ellipse 80% 60% at 50% 100%, rgba(5,63,128,.45), rgba(11,18,32,0) 70%)}
main{width:100%; max-width:560px; text-align:center}
.logo{display:block; width:220px; height:auto; margin:0 auto 56px}
h1{font-family:var(--serif); font-weight:400; font-size:clamp(40px, 8vw, 64px); line-height:1.05; letter-spacing:-.03em}
.lead{margin-top:20px; font-size:18px; color:rgba(255,255,255,.8)}
.help{margin-top:28px; color:rgba(255,255,255,.8)}
.email{display:inline-block; padding-bottom:3px; font-weight:700; color:#fff; text-decoration:none;
  background:linear-gradient(currentColor, currentColor) 0 100% / 100% 1.5px no-repeat}
.email:hover{background-size:0 1.5px; background-position:100% 100%}
.email:focus-visible{outline:2px solid var(--primary-200); outline-offset:4px; border-radius:4px}
.urgent{margin-top:48px; padding:18px 22px; border-radius:var(--r-lg); background:var(--ink-800);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); font-size:14px; color:rgba(255,255,255,.8)}
.urgent a{color:#fff; font-weight:700}
@media (min-width:720px){ .logo{width:260px} }
</style>
</head>
<body>
<main>

  <h1>We will be back shortly</h1>
  <p class="lead">SaathMera is down for a few minutes of planned maintenance. Please try again soon.</p>
  <p class="help">Need us in the meantime? Write to <a class="email" href="mailto:support@saathmera.in">support@saathmera.in</a></p>
  <p class="urgent">SaathMera is not an emergency service. In a medical emergency, dial <a href="tel:108">108</a> for an ambulance.</p>
</main>
